pre-commit:
  jobs:
    - run: bun x ultracite fix
      glob:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
      stage_fixed: true
    - run: bun build
      glob:
        - '*.ts'
        - '*.tsx'
      stage_fixed: true
